apiVersion: apps/v1
kind: Deployment
metadata:
  name: station-service
  labels:
    app.kubernetes.io/name: station-service
    app.kubernetes.io/part-of: chargesquare
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: station-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: station-service
        app.kubernetes.io/part-of: chargesquare
    spec:
      containers:
        - name: station-service
          image: chargesquare/station-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: chargesquare-config
          env:
            - name: STATION_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: chargesquare-postgres
                  key: username
            - name: STATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chargesquare-postgres
                  key: password
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
