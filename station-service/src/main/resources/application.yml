spring:
  application:
    name: station-service
  datasource:
    url: ${STATION_DB_URL}
    username: ${STATION_DB_USERNAME}
    password: ${STATION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    schemas: station
    default-schema: station
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${STATION_SERVICE_PORT:8081}

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
