spring:
  application:
    name: station-service
  datasource:
    url: ${STATION_DB_URL}
    username: ${STATION_DB_USERNAME}
    password: ${STATION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    schemas: ${STATION_DB_SCHEMA:station}
    default-schema: ${STATION_DB_SCHEMA:station}
    create-schemas: true
    placeholders:
      station_schema: ${STATION_DB_SCHEMA:station}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${STATION_DB_SCHEMA:station}
    open-in-view: false

security:
  jwt:
    signing-secret: ${JWT_SIGNING_SECRET}
    issuer: ${JWT_ISSUER:chargesquare-session-service}
    audience: ${JWT_AUDIENCE:chargesquare-api}

panel:
  allowed-origin: ${PANEL_ALLOWED_ORIGIN:http://localhost:5173}

springdoc:
  show-actuator: true
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${STATION_SERVICE_PORT:8081}

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
