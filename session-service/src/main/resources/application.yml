spring:
  application:
    name: session-service
  datasource:
    url: ${SESSION_DB_URL}
    username: ${SESSION_DB_USERNAME}
    password: ${SESSION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    schemas: ${SESSION_DB_SCHEMA:session}
    default-schema: ${SESSION_DB_SCHEMA:session}
    create-schemas: true
    placeholders:
      session_schema: ${SESSION_DB_SCHEMA:session}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SESSION_DB_SCHEMA:session}
    open-in-view: false

security:
  jwt:
    signing-secret: ${JWT_SIGNING_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    service-token-ttl: ${JWT_SERVICE_TTL:60s}
    issuer: ${JWT_ISSUER:chargesquare-session-service}
    audience: ${JWT_AUDIENCE:chargesquare-api}

panel:
  allowed-origin: ${PANEL_ALLOWED_ORIGIN:http://localhost:5173}

station-service:
  base-url: ${STATION_SERVICE_URL:http://localhost:8081}
  connect-timeout: ${STATION_CONNECT_TIMEOUT:2s}
  read-timeout: ${STATION_READ_TIMEOUT:3s}

server:
  port: ${SESSION_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
