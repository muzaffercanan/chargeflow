spring:
  datasource:
    url: jdbc:h2:mem:session_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=SESSION,USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    schemas: session
    default-schema: session
    create-schemas: true
    placeholders:
      session_schema: session
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: session
    open-in-view: false

station-service:
  base-url: http://station.test
  connect-timeout: 2s
  read-timeout: 3s

security:
  jwt:
    signing-secret: test-signing-secret-with-at-least-32-bytes
    access-token-ttl: 15m
    service-token-ttl: 60s
    issuer: chargesquare-session-service
    audience: chargesquare-api

panel:
  allowed-origin: http://localhost:5173
