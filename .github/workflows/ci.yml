name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build both Maven modules
        run: ./mvnw -B -pl station-service,session-service -am package -DskipTests

      - name: Run all tests
        run: ./mvnw -B test

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install panel dependencies
        working-directory: panel
        run: npm ci

      - name: Test and build panel
        working-directory: panel
        run: npm test && npm run build

      - name: Build Station Service image
        run: docker build --tag chargesquare/station-service:ci --file station-service/Dockerfile .

      - name: Build Session Service image
        run: docker build --tag chargesquare/session-service:ci --file session-service/Dockerfile .

      - name: Build Panel image
        run: docker build --tag chargesquare/panel:ci --file panel/Dockerfile .

  authenticated-e2e:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: chargesquare-e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Ensure smoke-test tools are available
        run: command -v jq || (sudo apt-get update && sudo apt-get install --yes jq)

      - name: Start clean Compose stack and wait for health
        run: >-
          docker compose --env-file .env.example
          --project-name "$COMPOSE_PROJECT_NAME"
          up --build --detach --wait --wait-timeout 240

      - name: Run authenticated cross-service smoke test
        run: bash scripts/e2e-smoke.sh

      - name: Print Compose logs on failure
        if: failure()
        run: >-
          docker compose --env-file .env.example
          --project-name "$COMPOSE_PROJECT_NAME"
          logs --no-color

      - name: Tear down project-scoped Compose stack
        if: always()
        run: >-
          docker compose --env-file .env.example
          --project-name "$COMPOSE_PROJECT_NAME"
          down --volumes --remove-orphans
