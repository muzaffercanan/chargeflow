name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build both Maven modules
        run: ./mvnw -B -pl station-service,session-service -am package -DskipTests

      - name: Run all tests
        run: ./mvnw -B test

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install panel dependencies
        working-directory: panel
        run: npm ci

      - name: Test and build panel
        working-directory: panel
        run: npm test && npm run build

      - name: Build Station Service image
        run: docker build --tag chargesquare/station-service:ci --file station-service/Dockerfile .

      - name: Build Session Service image
        run: docker build --tag chargesquare/session-service:ci --file session-service/Dockerfile .

      - name: Build Panel image
        run: docker build --tag chargesquare/panel:ci --file panel/Dockerfile .
